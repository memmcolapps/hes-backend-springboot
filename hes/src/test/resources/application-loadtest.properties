# Load-test profile: runs the real scheduler/persistence pipeline against a
# dedicated set of fake LOADTEST-HH meters. No DLMS traffic (reader is stubbed).
# Default target DB = dev (gridflex-Demo); override with LOADTEST_DB_* env vars.

spring.application.name=hes-service-loadtest
server.port=0
nettyserver.port=29164

hes.token.issuer=hes-loadtest
hes.token.access.validity=1800000
hes.token.refresh.validity=86400000
hes.token.secret=$2a$10$4Xz9f7p8Qz9kX3y2W5V2O.9J2kX8mY7nZ6W5V4U3I2O9P8Q7R6T5

logging.level.root=WARN
logging.level.com.memmcol=WARN
logging.level.com.memmcol.hes.jobs.services=INFO
logging.level.com.memmcol.hes.config=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.scheduling=INFO
logging.level.org.hibernate=WARN

spring.datasource.url=${LOADTEST_DB_URL:jdbc:postgresql://172.16.10.28:8324/gridflex-Demo}
spring.datasource.username=${LOADTEST_DB_USERNAME:TestUser}
spring.datasource.password=${LOADTEST_DB_PASSWORD:TestUser0405&}
spring.datasource.driver-class-name=org.postgresql.Driver

eureka.client.enabled=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.connection.autocommit=true
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.pool-name=HikariPool-HES-LOADTEST

spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

spring.security.user.name=svc_hes_loadtest
spring.security.user.password=loadtestPassword123

hes.profile.execution.window.enabled=false
hes.profile.execution.batch-size=50
hes.profile.execution.per-meter-timeout-seconds=120
hes.meter.executor.size=10
