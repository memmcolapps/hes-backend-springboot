# Production profile: application-prod.properties
spring.application.name=hes-service
nettyserver.port=29062
#29067
# Logging
logging.level.com.memmcol=DEBUG
logging.level.org.hibernate=INFO
logging.level.org.springframework=INFO

# Database
spring.datasource.url=jdbc:postgresql://${PROD_DB_HOST}:${PROD_DB_PORT}/${PROD_DB_NAME}?ApplicationName=hes-service
spring.datasource.username=${PROD_DB_USERNAME}
spring.datasource.password=${PROD_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Eureka settings
eureka.client.service-url.defaultZone=http://${EUREKA_ADDRESS}:${EUREKA_PORT}/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=${spring.cloud.client.ip-address}
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.metadata-map.management.port=${management.server.port:${server.port}}
eureka.instance.status-page-url-path=/actuator/info
eureka.instance.health-check-url-path=/actuator/health

# Actuator
management.endpoints.web.exposure.include=*
management.metrics.enable.cache=true
management.endpoints.web.base-path=/actuator
management.endpoint.prometheus.access=read_only
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

####Eureka is a Service Registry (from Netflix OSS, integrated with Spring Cloud).
#eureka.client.service-url.defaultZone=http://${EUREKA_ADDRESS}:${EUREKA_PORT}/eureka/
#eureka.client.register-with-eureka=true
#eureka.client.fetch-registry=true
#eureka.instance.prefer-ip-address=true

# Hibernate JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.connection.autocommit=false

# HikariCP
spring.datasource.hikari.maximum-pool-size=60
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.pool-name=HikariPool-HES-PROD

# Security
spring.security.user.name=${SPRING_SECURITY_USER}
spring.security.user.password=${SPRING_SECURITY_PASSWORD}

#HES Executor pool
hes.meter.executor.size=50

# Household meters: comma-separated list of model numbers eligible for household profile jobs
hes.profile.household.models=${HES_HOUSEHOLD_MODELS:MMX-110-NG,MMX-310-NG,MMX-110-DIN}

# Household-tier OBIS for token events (MD/CT tier uses scheduler_job_info.obis_codes).
hes.events.profiles[recharge-token].household=${HES_EVENT_RECHARGE_TOKEN_OBIS_HH:0.0.99.98.3.255}
hes.events.profiles[management-token].household=${HES_EVENT_MANAGEMENT_TOKEN_OBIS_HH:0.0.99.98.5.255}
hes.events.profiles[fraud-event].household=${HES_EVENT_FRAUD_OBIS_HH:0.0.99.98.1.255}
hes.events.profiles[control-event].household=${HES_EVENT_CONTROL_OBIS_HH:0.0.99.98.2.255}

# Monthly billing determinants pipeline (continuous + 5-day grace window)
hes.billing.determinants.continuous.enabled=true
hes.billing.determinants.read-window-days=7
hes.billing.determinants.grace-period.days=5
hes.profile.execution.window.enabled=true

logging.level.org.springframework.cloud.gateway=DEBUG
logging.file.name=${WIN_LOCATION}/logs/hes.log

logging.logback.rollingpolicy=max-file-size=20MB
logging.logback.rollingpolicy.max-history=10
logging.logback.rollingpolicy.total-size-cap=1GB
logging.logback.rollingpolicy.file-name-pattern=${WIN_LOCATION}/logs/hes.%d{yyyy-MM-dd}.%i.log
